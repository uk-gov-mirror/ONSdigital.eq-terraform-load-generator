platform: linux
inputs:
  - name: eq-terraform-load-generator
params:
  PROJECT_ID:
image_resource:
  type: registry-image
  source:
    repository: ((image_registry))/eq-terraform-deploy-image
    tag: ((deploy_image_version))
run:
  path: bash
  args:
    - -exc
    - |
      cd eq-terraform-load-generator
      ./scripts/deploy_infrastructure.sh
